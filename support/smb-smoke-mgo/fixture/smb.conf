[global]
  server role = standalone server
  server min protocol = SMB2_10
  server max protocol = SMB3_11
  disable netbios = yes
  smb ports = 445
  map to guest = Never
  restrict anonymous = 2
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1
  # On-demand RPC helpers fail to bind their pipes in a container;
  # the entrypoint starts samba-dcerpcd itself.
  rpc start on demand helpers = no
  include = /etc/samba/dialect.conf

[smoke]
  path = /share
  read only = yes
  browseable = yes
  valid users = smoke
