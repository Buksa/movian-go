version: "2"

run:
  timeout: 5m
  tests: true

# Ratchet config: enable only linters that currently pass clean.
# The wider aspirational set (staticcheck, errcheck, gosec, revive,
# gocritic, godot, exhaustive, goconst, gocyclo, unconvert, unparam,
# unused, whitespace, dupl, misspell, nilnil, nilerr, errorlint,
# prealloc, goimports...) reports ~9k findings on this codebase —
# re-enable linter-by-linter as they're fixed.
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - govet
    - gomodguard_v2
    - nakedret
    - nolintlint
    - tparallel

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - gosec
          - errcheck
      - path: cmd/movian-go/main\.go
        linters:
          - gocyclo
      - path: pkg/libav/
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
