version: "2"

run:
  timeout: 5m
  tests: true

# Ratchet config: enable only linters that currently pass clean.
# The wider aspirational set (staticcheck, errcheck, gosec, revive,
# gocritic, godot, exhaustive, goconst, gocyclo, unparam,
# unused, prealloc, godot...) reports ~9k findings on this codebase —
# re-enable linter-by-linter as they're fixed.
# nilnil is intentionally disabled: `return nil, nil` ("no result, no
# error") is a deliberate convention throughout the loader/backend APIs,
# mirroring the C NULL semantics — a sentinel error would diverge from
# upstream behavior.
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - govet
    - gomodguard_v2
    - dupl
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - tparallel
    - unconvert
    - whitespace

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - gosec
          - errcheck
          - nilerr
      - path: cmd/movian-go/main\.go
        linters:
          - gocyclo
      - path: pkg/libav/
        linters:
          - gosec
      # Generated charset lookup tables — structural duplication by design.
      - path: internal/misc/(codepages|charset_detector|big5|str_utf8|str_url)\.go
        linters:
          - dupl

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
